stages:
  split_data:
    cmd: uv run python src/split_data.py
    deps:
    - data/raw.csv
    - src/split_data.py
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train_model:
    cmd: uv run python src/train_model.py
    deps:
    - data/processed/train.csv
    - src/train_model.py
    params:
    - train.max_depth
    - train.n_estimators
    - train.random_state
    outs:
    - models/model.joblib
  evaluate_model:
    cmd: uv run python src/evaluate_model.py
    deps:
    - data/processed/test.csv
    - models/model.joblib
    - src/evaluate_model.py
    outs:
    - reports/confusion_matrix.png
    metrics:
    - reports/metrics.json:
        cache: false
