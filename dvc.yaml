stages:
  split_data:
    cmd: uv run python src/split_data.py
    deps:
      - data/raw.csv
      - src/split_data.py
    params:
      - data.test_size
      - data.random_state
    outs:
      - data/processed/development.csv
      - data/processed/test.csv

  cross_validate:
    cmd: uv run python src/cross_validate.py
    deps:
      - data/processed/development.csv
      - src/cross_validate.py
    params:
      - cv.n_splits
      - cv.random_state
      - cv.selection_metric
      - cv.param_grid
      - train.random_state
    outs:
      - reports/cv/cv_results.csv
      - reports/cv/best_params.json

  train_model:
    cmd: uv run python src/train_model.py
    deps:
      - data/processed/development.csv
      - reports/cv/best_params.json
      - src/train_model.py
    params:
      - train.random_state
    outs:
      - models/model.joblib

  evaluate_model:
    cmd: uv run python src/evaluate_model.py
    deps:
      - data/processed/development.csv
      - data/processed/test.csv
      - models/model.joblib
      - src/evaluate_model.py
      - requirements-model.txt
    outs:
      - reports/confusion_matrix.png
    metrics:
      - reports/metrics.json:
          cache: false
