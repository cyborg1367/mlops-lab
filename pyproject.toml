[project]
name = "mlops-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.165.0",
    "joblib==1.4.2",
    "matplotlib==3.10.1",
    "mlflow>=3.7,<4",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]