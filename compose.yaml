
services:
  mlflow:
    image: mlops-api:1.0
    container_name: mlops-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:5000,localhost:5000,127.0.0.1:5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlartifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  registry-init:
    image: mlops-api:1.0
    container_name: mlops-registry-init
    command:
      - python
      - src/initialize_registry.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    image: mlops-api:1.0
    container_name: mlops-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      registry-init:
        condition: service_completed_successfully
    restart: unless-stopped
